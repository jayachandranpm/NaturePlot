[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "natureplot"
dynamic = ["version"]
description = "Create interactive nature-inspired SVG charts from Python, with an offline browser renderer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["charts", "visualization", "svg", "nature", "jupyter", "html"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://jayachandranpm.github.io/NaturePlot/"
Documentation = "https://jayachandranpm.github.io/NaturePlot/docs/#/python"
Repository = "https://github.com/jayachandranpm/NaturePlot"
Issues = "https://github.com/jayachandranpm/NaturePlot/issues"
"JavaScript package" = "https://www.npmjs.com/package/natureplot"

[tool.hatch.version]
path = "src/natureplot/_version.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/natureplot"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/hatch_build.py", "/README.md", "/LICENSE"]
